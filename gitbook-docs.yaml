$schema: https://api.gitbook.com/gitbook-docs.yaml
site:
  title: Wiki - DropMC
  structure:
    - type: section
      key: section-1
      title: Wiki - DropMC
      path: wiki
      icon: book-open
      default: true
      children:
        - type: space
          key: space-1
          title: Wiki - DropMC
          path: home
          default: true
          content:
            directory: ./wiki/home
            language: pt-br
    - type: section
      key: section-2
      title: Documentation
      path: documentation
      icon: book-blank
      children:
        - type: space
          key: space-2
          title: Wiki - DropMC
          path: documentation
          default: true
          hidden: true
          content:
            directory: ./wiki/home
            language: pt-br
    - type: section
      key: section-3
      title: API Reference
      path: api-reference
      icon: terminal
      children:
        - type: space
          key: space-3
          title: API Reference
          path: api-reference
          default: true
          hidden: true
          content:
            directory: ./api-reference
    - type: section
      key: section-4
      title: Changelog
      path: changelog
      icon: clock-rotate-left
      children:
        - type: space
          key: space-4
          title: Changelog
          path: changelog
          default: true
          hidden: true
          content:
            directory: ./changelog
    - type: section
      key: section-5
      title: Help Center
      path: help-center
      icon: life-ring
      children:
        - type: space
          key: space-5
          title: Help Center
          path: help-center
          default: true
          hidden: true
          content:
            directory: ./help-center
